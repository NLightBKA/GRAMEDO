<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'unsafe-inline'; script-src 'nonce-{{NONCE}}';"/>
  <title>GRAMEDO — RAG Memory</title>
  <style>
    /* ── Reset & base ─────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0d0d0f;
      --surface:     #16161a;
      --surface2:    #1e1e24;
      --border:      #2a2a35;
      --accent:      #7c6af7;
      --accent2:     #4fc3f7;
      --accent3:     #69f0ae;
      --danger:      #ef5350;
      --text:        #e8e8f0;
      --text-muted:  #8888a0;
      --text-dim:    #555568;
      --radius:      10px;
      --radius-sm:   6px;
      --font:        'Segoe UI', system-ui, -apple-system, sans-serif;
      --font-mono:   'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      --shadow:      0 4px 24px rgba(0,0,0,0.4);
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 0;
      font-size: 13px;
      line-height: 1.5;
      overflow-x: hidden;
    }

    /* ── Scrollbar ────────────────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── Layout ───────────────────────────────────────────────────────────── */
    .container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px 14px 24px;
      max-width: 100%;
    }

    /* ── Header ───────────────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      box-shadow: 0 0 16px rgba(124,106,247,0.4);
    }

    .header-text h1 {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.06em;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-text p {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    /* ── Card ─────────────────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      transition: border-color 0.2s;
    }

    .card:hover { border-color: #3a3a4a; }

    .card-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-label::before {
      content: '';
      display: inline-block;
      width: 3px;
      height: 10px;
      background: var(--accent);
      border-radius: 2px;
    }

    /* ── Root selector ────────────────────────────────────────────────────── */
    .root-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .root-path {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 7px 10px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--accent2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    /* ── Buttons ──────────────────────────────────────────────────────────── */
    .btn {
      border: none;
      cursor: pointer;
      border-radius: var(--radius-sm);
      font-family: var(--font);
      font-size: 12px;
      font-weight: 500;
      padding: 7px 12px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #5a4fd6);
      color: #fff;
      box-shadow: 0 2px 10px rgba(124,106,247,0.35);
    }
    .btn-primary:hover { box-shadow: 0 4px 16px rgba(124,106,247,0.55); filter: brightness(1.1); }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    .btn-ghost {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .btn-ghost:hover { background: var(--border); color: var(--text); }

    .btn-danger {
      background: transparent;
      border: 1px solid var(--danger);
      color: var(--danger);
    }
    .btn-danger:hover { background: rgba(239,83,80,0.1); }

    .btn-sm {
      padding: 5px 9px;
      font-size: 11px;
    }

    /* ── Status badge ─────────────────────────────────────────────────────── */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }
    .status-badge .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
    }
    .status-idle   { background: rgba(85,85,104,0.2); color: var(--text-muted); }
    .status-idle .dot { background: var(--text-dim); }
    .status-ready  { background: rgba(105,240,174,0.15); color: var(--accent3); }
    .status-ready .dot { background: var(--accent3); box-shadow: 0 0 6px var(--accent3); animation: pulse 2s infinite; }
    .status-busy   { background: rgba(124,106,247,0.15); color: var(--accent); }
    .status-busy .dot { background: var(--accent); animation: pulse 1s infinite; }
    .status-error  { background: rgba(239,83,80,0.12); color: var(--danger); }
    .status-error .dot { background: var(--danger); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ── Stats row ────────────────────────────────────────────────────────── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .stat-box {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px;
      text-align: center;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .stat-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* ── Progress ─────────────────────────────────────────────────────────── */
    .progress-section { display: none; }
    .progress-section.visible { display: block; }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .progress-file {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-dim);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 60%;
    }

    .progress-bar-track {
      background: var(--surface2);
      border-radius: 4px;
      height: 5px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width 0.3s ease;
      box-shadow: 0 0 8px rgba(124,106,247,0.5);
    }

    /* ── Language list ────────────────────────────────────────────────────── */
    .lang-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .lang-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 8px;
      border-radius: var(--radius-sm);
      background: var(--surface2);
      border: 1px solid transparent;
      transition: border-color 0.2s;
    }
    .lang-row:hover { border-color: var(--border); }

    .lang-icon { font-size: 14px; width: 20px; text-align: center; flex-shrink: 0; }
    .lang-name { flex: 1; font-size: 12px; font-weight: 500; }
    .lang-count { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
    .lang-check { font-size: 12px; }
    .lang-check.ok { color: var(--accent3); }
    .lang-check.none { color: var(--text-dim); }

    /* ── Action row ───────────────────────────────────────────────────────── */
    .action-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* ── Error message ────────────────────────────────────────────────────── */
    .error-msg {
      display: none;
      background: rgba(239,83,80,0.08);
      border: 1px solid rgba(239,83,80,0.3);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      font-size: 11px;
      color: var(--danger);
      font-family: var(--font-mono);
    }
    .error-msg.visible { display: block; }

    /* ── Timestamp ────────────────────────────────────────────────────────── */
    .timestamp {
      font-size: 10px;
      color: var(--text-dim);
      text-align: right;
      font-family: var(--font-mono);
    }

    /* ── Divider ──────────────────────────────────────────────────────────── */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 2px 0;
    }

    /* ── Animated spinner (for busy state) ───────────────────────────────── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinning { animation: spin 1s linear infinite; display: inline-block; }

    /* ── Fade in ──────────────────────────────────────────────────────────── */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .card { animation: fadeIn 0.25s ease both; }
  </style>
</head>
<body>
<div class="container">

  <!-- ── Header ──────────────────────────────────────────────────────────── -->
  <div class="header">
    <div class="logo">🧠</div>
    <div class="header-text">
      <h1>GRAMEDO</h1>
      <p>RAG MEMORY INDEXER · v0.1</p>
    </div>
  </div>

  <!-- ── Root selector ───────────────────────────────────────────────────── -->
  <div class="card">
    <div class="card-label">Project Root</div>
    <div class="root-row">
      <div class="root-path" id="rootPath" title="">—</div>
      <button class="btn btn-ghost btn-sm" id="btnBrowse" title="Choose a different project root">📁</button>
    </div>
  </div>

  <!-- ── Status ──────────────────────────────────────────────────────────── -->
  <div class="card" id="statusCard">
    <div class="card-label">Status</div>
    <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:6px;">
      <span class="status-badge status-idle" id="statusBadge">
        <span class="dot"></span>
        <span id="statusText">Not indexed</span>
      </span>
      <span class="timestamp" id="lastUpdated"></span>
    </div>

    <!-- Progress bar -->
    <div class="progress-section" id="progressSection" style="margin-top:10px;">
      <div class="progress-info">
        <span id="progressLabel">Scanning…</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
      </div>
      <div class="progress-file" id="progressFile"></div>
    </div>

    <!-- Error -->
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <!-- ── Stats ───────────────────────────────────────────────────────────── -->
  <div class="card" id="statsCard" style="display:none;">
    <div class="card-label">Graph Statistics</div>
    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-value" id="statNodes">0</div>
        <div class="stat-label">Nodes</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="statEdges">0</div>
        <div class="stat-label">Edges</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="statFiles">0</div>
        <div class="stat-label">Files</div>
      </div>
    </div>
  </div>

  <!-- ── Language breakdown ──────────────────────────────────────────────── -->
  <div class="card" id="langCard" style="display:none;">
    <div class="card-label">Languages Indexed</div>
    <div class="lang-list" id="langList">
      <!-- Populated by JS -->
    </div>
  </div>

  <!-- ── Actions ─────────────────────────────────────────────────────────── -->
  <div class="card">
    <div class="card-label">Actions</div>
    <div class="action-row">
      <button class="btn btn-primary" id="btnUpdate">
        <span id="btnUpdateIcon">🔄</span> Update Index
      </button>
      <button class="btn btn-ghost btn-sm" id="btnOpenFolder" style="display:none;" title="Open .memory/ in Explorer">
        📂 Open .memory
      </button>
      <button class="btn btn-ghost btn-sm" id="btnCopy" style="display:none;" title="Copy graph.json path">
        📋 Copy path
      </button>
      <button class="btn btn-danger btn-sm" id="btnClear" style="display:none;" title="Delete .memory/ folder">
        🗑️ Clear
      </button>
    </div>
  </div>

</div>

<script nonce="{{NONCE}}">
  // ── VS Code API bridge ───────────────────────────────────────────────────
  const vscode = acquireVsCodeApi();

  // ── State ────────────────────────────────────────────────────────────────
  let state = {
    root: null,
    hasMemory: false,
    isBusy: false,
    stats: null,
    lastUpdated: null,
    byLanguage: {},
  };

  // ── Language meta ─────────────────────────────────────────────────────────
  const LANG_META = {
    java:       { icon: '☕', label: 'Java' },
    python:     { icon: '🐍', label: 'Python' },
    javascript: { icon: '🌐', label: 'JavaScript' },
    typescript: { icon: '🔷', label: 'TypeScript' },
    csharp:     { icon: '🔵', label: 'C#' },
    cpp:        { icon: '⚙️', label: 'C / C++' },
  };

  // ── DOM refs ──────────────────────────────────────────────────────────────
  const $root         = document.getElementById('rootPath');
  const $statusBadge  = document.getElementById('statusBadge');
  const $statusText   = document.getElementById('statusText');
  const $lastUpdated  = document.getElementById('lastUpdated');
  const $progressSec  = document.getElementById('progressSection');
  const $progressLbl  = document.getElementById('progressLabel');
  const $progressPct  = document.getElementById('progressPct');
  const $progressBar  = document.getElementById('progressBar');
  const $progressFile = document.getElementById('progressFile');
  const $errorMsg     = document.getElementById('errorMsg');
  const $statsCard    = document.getElementById('statsCard');
  const $statNodes    = document.getElementById('statNodes');
  const $statEdges    = document.getElementById('statEdges');
  const $statFiles    = document.getElementById('statFiles');
  const $langCard     = document.getElementById('langCard');
  const $langList     = document.getElementById('langList');
  const $btnUpdate    = document.getElementById('btnUpdate');
  const $btnUpdateIcon= document.getElementById('btnUpdateIcon');
  const $btnBrowse    = document.getElementById('btnBrowse');
  const $btnOpenFolder= document.getElementById('btnOpenFolder');
  const $btnCopy      = document.getElementById('btnCopy');
  const $btnClear     = document.getElementById('btnClear');

  // ── Button handlers ───────────────────────────────────────────────────────
  $btnUpdate.addEventListener('click', () => {
    if (state.isBusy) { return; }
    vscode.postMessage({ type: 'update' });
  });

  $btnBrowse.addEventListener('click', () => {
    vscode.postMessage({ type: 'browse' });
  });

  $btnOpenFolder.addEventListener('click', () => {
    vscode.postMessage({ type: 'openMemoryFolder' });
  });

  $btnCopy.addEventListener('click', () => {
    vscode.postMessage({ type: 'copyPath' });
  });

  $btnClear.addEventListener('click', () => {
    vscode.postMessage({ type: 'clear' });
  });

  // ── Message handler ───────────────────────────────────────────────────────
  window.addEventListener('message', (event) => {
    const msg = event.data;
    switch (msg.type) {

      case 'init':
        state.root = msg.root;
        state.hasMemory = msg.hasMemory;
        state.stats = msg.stats ?? null;
        state.lastUpdated = msg.lastUpdated ?? null;
        state.byLanguage = msg.byLanguage ?? {};
        renderAll();
        break;

      case 'rootChanged':
        state.root = msg.root;
        state.hasMemory = msg.hasMemory;
        state.stats = msg.stats ?? null;
        state.lastUpdated = msg.lastUpdated ?? null;
        state.byLanguage = msg.byLanguage ?? {};
        renderAll();
        break;

      case 'progress':
        handleProgress(msg);
        break;

      case 'done':
        state.isBusy = false;
        state.hasMemory = true;
        state.stats = msg.stats;
        state.byLanguage = msg.stats?.by_language ?? {};
        state.lastUpdated = new Date().toISOString();
        renderAll();
        setProgress(100, 'Index complete ✓', '');
        setTimeout(() => hideProgress(), 1800);
        break;

      case 'error':
        state.isBusy = false;
        setBusy(false);
        showError(msg.message);
        hideProgress();
        break;
    }
  });

  // ── Render ────────────────────────────────────────────────────────────────
  function renderAll() {
    // Root path
    if (state.root) {
      $root.textContent = state.root;
      $root.title = state.root;
    } else {
      $root.textContent = '— no workspace open —';
    }

    // Status badge
    if (state.isBusy) {
      setStatus('busy', '⟳ Indexing…');
    } else if (state.hasMemory) {
      setStatus('ready', 'Ready');
    } else {
      setStatus('idle', 'Not indexed');
    }

    // Last updated
    if (state.lastUpdated) {
      const d = new Date(state.lastUpdated);
      $lastUpdated.textContent = `Updated ${d.toLocaleDateString()} ${d.toLocaleTimeString()}`;
    } else {
      $lastUpdated.textContent = '';
    }

    // Stats
    if (state.stats) {
      $statsCard.style.display = 'block';
      $statNodes.textContent = fmt(state.stats.nodes);
      $statEdges.textContent = fmt(state.stats.edges);
      $statFiles.textContent = fmt(state.stats.files);
    } else {
      $statsCard.style.display = 'none';
    }

    // Language list
    renderLangs();

    // Action buttons
    const memoryExists = state.hasMemory;
    $btnOpenFolder.style.display = memoryExists ? '' : 'none';
    $btnCopy.style.display       = memoryExists ? '' : 'none';
    $btnClear.style.display      = memoryExists ? '' : 'none';

    setBusy(state.isBusy);
    hideError();
  }

  function renderLangs() {
    const byLang = state.byLanguage ?? {};
    const langs = Object.keys(LANG_META);
    const hasAny = langs.some(l => (byLang[l] ?? 0) > 0);

    if (!hasAny && !state.hasMemory) {
      $langCard.style.display = 'none';
      return;
    }

    $langCard.style.display = 'block';
    $langList.innerHTML = '';

    for (const lang of langs) {
      const meta = LANG_META[lang];
      const count = byLang[lang] ?? 0;
      const row = document.createElement('div');
      row.className = 'lang-row';
      row.innerHTML = `
        <span class="lang-icon">${meta.icon}</span>
        <span class="lang-name">${meta.label}</span>
        <span class="lang-count">${count > 0 ? count + ' nodes' : '—'}</span>
        <span class="lang-check ${count > 0 ? 'ok' : 'none'}">${count > 0 ? '✓' : '·'}</span>
      `;
      $langList.appendChild(row);
    }
  }

  // ── Progress helpers ──────────────────────────────────────────────────────
  function handleProgress(msg) {
    state.isBusy = true;
    setBusy(true);
    hideError();

    switch (msg.phase) {
      case 'scan':
        showProgress();
        setProgress(2, `Scanning… found ${msg.total} files`, '');
        break;
      case 'parse':
        const pct = Math.round((msg.current / msg.total) * 85) + 5;
        setProgress(pct, `Parsing ${msg.current}/${msg.total}`, msg.file);
        break;
      case 'build':
        setProgress(92, 'Building graph…', '');
        break;
      case 'write':
        setProgress(97, 'Writing .memory/…', '');
        break;
    }
  }

  function showProgress() { $progressSec.classList.add('visible'); }
  function hideProgress() { $progressSec.classList.remove('visible'); }

  function setProgress(pct, label, file) {
    $progressBar.style.width = pct + '%';
    $progressLbl.textContent = label;
    $progressPct.textContent = pct + '%';
    $progressFile.textContent = file;
  }

  // ── Status helpers ────────────────────────────────────────────────────────
  function setStatus(type, text) {
    $statusBadge.className = 'status-badge status-' + type;
    $statusText.textContent = text;
  }

  function setBusy(busy) {
    $btnUpdate.disabled = busy;
    $btnUpdateIcon.textContent = busy ? '⏳' : '🔄';
    if (!busy) { setStatus(state.hasMemory ? 'ready' : 'idle', state.hasMemory ? 'Ready' : 'Not indexed'); }
  }

  // ── Error helpers ─────────────────────────────────────────────────────────
  function showError(msg) {
    $errorMsg.textContent = '⚠ ' + msg;
    $errorMsg.classList.add('visible');
    setStatus('error', 'Error');
  }
  function hideError() { $errorMsg.classList.remove('visible'); }

  // ── Utilities ─────────────────────────────────────────────────────────────
  function fmt(n) {
    if (n === undefined || n === null) { return '—'; }
    return n.toLocaleString();
  }

  // ── Initial state request ─────────────────────────────────────────────────
  vscode.postMessage({ type: 'ready' });
</script>
</body>
</html>
